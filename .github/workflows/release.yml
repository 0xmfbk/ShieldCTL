name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  publish:
    name: Publish release assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Build release assets
        run: |
          test -x shieldctl
          sha256sum shieldctl > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" shieldctl SHA256SUMS \
            --verify-tag \
            --title "ShieldCTL ${GITHUB_REF_NAME}" \
            --generate-notes
