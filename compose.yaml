services:
  debian:
    build:
      context: .
      args:
        BASE_IMAGE: debian:13-slim
    image: shieldctl-test:debian
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
      - /run
    volumes:
      - .:/workspace:ro

  fedora:
    build:
      context: .
      args:
        BASE_IMAGE: fedora:latest
    image: shieldctl-test:fedora
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
      - /run
    volumes:
      - .:/workspace:ro
